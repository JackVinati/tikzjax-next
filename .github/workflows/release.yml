name: Release
#
# Push the TAG BEFORE pushing main.
#
# The community store reads manifest.json from the default branch and looks for a release with that
# version. Between a version bump landing on main and this workflow publishing, there is a window
# where the two disagree and the store reports "no release matches your manifest version". Pushing
# the tag first closes it: the release is being built before the bumped manifest is public.
#
#   git commit -m '0.1.3 — …'      # the bump is IN the tagged commit; this workflow checks that
#   git tag -a 0.1.3 -F -
#   git push origin 0.1.3          # release starts building
#   git push origin main           # after it finishes

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  # For actions/attest: `id-token` mints the OIDC token that proves the build ran
  # in this workflow, `attestations` records the result. Without them a user downloading main.js
  # has only a filename and 11 MB of minified code to go on.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in the one job that can publish a release and mint an OIDC token —
          # setup-node's own advice for privileged workflows. It costs one uncached npm ci.
          package-manager-cache: false

      - run: npm ci

      - name: The tag, the manifest and versions.json agree
        # The plugin this forks from released five versions with versions.json still saying
        # {"0.1.0":"0.12.0"}, and shipped its zip as `obsidian-tikzjax-.zip` because a removed
        # ::set-output silently produced an empty string. Both are the same failure: nothing
        # checked. This is the check.
        run: |
          TAG="${GITHUB_REF_NAME}"
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG;
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            if (manifest.version !== tag) {
              console.error(`tag ${tag} != manifest.version ${manifest.version}`);
              process.exit(1);
            }
            if (versions[tag] !== manifest.minAppVersion) {
              console.error(`versions.json["${tag}"] != manifest.minAppVersion`);
              process.exit(1);
            }
          '
        env:
          TAG: ${{ github.ref_name }}

      - run: npm run lint && npm run lint:store && npm run typecheck && npm test

      # No engine build here any more. The compressed engine is committed (D12), so this checkout
      # already has exactly the bytes the plugin is built from — and the Engine workflow rebuilds it
      # from source on main and diffs it, which is where that check belongs. Rebuilding it again
      # here bought nothing and cost fifteen minutes, during which the store sees a manifest whose
      # release does not exist yet and reports the plugin as unpublishable.
      - name: Verify the engine
        run: npm run smoke && npm run verify:fork && npm run verify:worker

      - name: The native-character list describes the engine being shipped
        # CI checks this too, but not for the commit being released: the tag is pushed before main,
        # so CI on main runs after this workflow has published. Here is the only place the check runs
        # on the released commit before it ships — and a stale list is not a cosmetic fault, it is
        # the pre-flight lint warning under characters that render, or keeping quiet about ones that
        # do not.
        run: npm run scan:native -- --check

      - name: Build the plugin
        run: npm run build

      - name: Attest that these assets came from this repository
        # actions/attest itself: since v4, attest-build-provenance is only a wrapper around it, with the
        # same SLSA build-provenance default.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Record what this release contains
        # The engine is the part of a release nobody can inspect from the outside: a WebAssembly
        # TeX, a core dump and 245 TeX files, all inside main.js. Printing what went into it — the
        # upstream commits, the TeX Live flavour, the package versions — is what makes a given
        # release answerable to "which pgfplots is this?" without unpacking the bundle.
        run: |
          MIN=$(node -p 'require("./manifest.json").minAppVersion')
          {
            echo "Renders TikZ and LaTeX diagrams inside notes. No LaTeX installation, no network"
            echo "access: the whole TeX engine is compiled to WebAssembly and runs locally, on"
            echo "desktop and on mobile. Requires Obsidian ${MIN}."
            echo
            echo '### Installing'
            echo
            echo 'In Obsidian: Settings → Community plugins → Browse, search for TikZJax Next. To install by hand,'
            echo 'download `main.js`, `manifest.json` and `styles.css` below into'
            echo '`<vault>/.obsidian/plugins/tikzjax-next/` and enable it in Settings → Community plugins.'
            echo
            echo '### Engine'
            echo
            echo '```'
            cat engine-build/out/BUILD-MANIFEST.txt
            echo
            cat engine-build/out/tex-versions.txt
            echo '```'
          } > release-notes.md

      # Published, not a draft. The community store installs from the latest RELEASE and its automated
      # review scans it, and neither can see a draft. Add --draft back if
      # a release should ever be reviewed before it is downloadable.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            main.js manifest.json styles.css
