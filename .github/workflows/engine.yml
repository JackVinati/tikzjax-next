name: Engine

# The TeX engine build: Pascal -> WebAssembly, a 156 MiB core dump, and 245 TeX files resolved
# out of a pinned TeX Live. It takes about ten minutes and needs Docker, so it does not run on
# every push. It runs when its own inputs change, on a weekly schedule so a rotted upstream is
# found before a release needs it, and on demand.
on:
  push:
    # Branches only. A tag push runs the release workflow, which builds and verifies the engine
    # itself — without this filter both run, and the same fifteen minutes are spent twice.
    branches:
      - '**'
    paths:
      - 'engine-build/**'
      - 'engine-src/**'
      - '.github/workflows/engine.yml'
  pull_request:
    paths:
      - 'engine-build/**'
      - 'engine-src/**'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the engine image
        run: npm run engine:image

      - name: Build the engine
        run: npm run engine:build

      - name: The committed engine is the one this source produces
        # The compressed engine is committed so `npm run build` works in a clean checkout with no
        # Docker (internal/DECISIONS.md D12), which is only honest if it can be checked.
        #
        # The build is meant to be deterministic across machines: the TeX clock is pinned, gzip runs
        # with -n, and the Dockerfile regenerates language.dat with Perl's hash seed fixed. That last
        # one was missing for a month, and every image wrote language.dat in a random order; latex.ltx
        # reads it, so every runner produced a different core.dump. It was diagnosed at the time as
        # "Ubuntu's TeX Live moved" — but Ubuntu 24.04's texlive never changed; this file did.
        #
        # The `format inputs` hash in BUILD-MANIFEST covers the 146 files the format is built from,
        # language.dat included, and separates the two ways this step can fail:
        #
        #   inputs differ  -> something the format reads changed: a texlive update, or a new source of
        #                     disorder like language.dat was. A warning, with the evidence printed —
        #                     but no longer a routine one: until the next texlive update it should not
        #                     fire at all, and if it does, find out which input moved before rebuilding.
        #   inputs match,
        #   engine differs -> same inputs, different bytes: the build is not deterministic. Fails.
        run: |
          committed=$(git show HEAD:engine-build/out/BUILD-MANIFEST.txt | sed -n 's/^format inputs  *\([0-9a-f]*\).*/\1/p')
          rebuilt=$(sed -n 's/^format inputs  *\([0-9a-f]*\).*/\1/p' engine-build/out/BUILD-MANIFEST.txt)

          if git diff --stat --exit-code -- engine-build/out; then
            echo "engine-build/out matches a fresh build, byte for byte"
            exit 0
          fi

          echo "Committed engine was built from LaTeX kernel $committed"
          echo "This runner's image has                      $rebuilt"
          echo
          cat engine-build/out/BUILD-MANIFEST.txt
          echo
          cat engine-build/out/tex-versions.txt
          echo

          if [ -n "$committed" ] && [ -n "$rebuilt" ] && [ "$committed" != "$rebuilt" ]; then
            echo "::warning::The files the TeX format is built from differ from the committed engine's."
            echo "Do not assume texlive moved: last time it was a config file written in random order."
            echo "Compare tex-versions.txt above, and the language.dat hash in the image build log,"
            echo "before rebuilding with: npm run engine:image && npm run engine:build"
            exit 0
          fi

          echo "::error::the engine changed while its inputs did not — the build is not deterministic"
          echo "This is the case worth stopping for: same TeX Live, same sources, different bytes."
          exit 1

      - name: Report what it shipped
        run: |
          cat engine-build/out/BUILD-MANIFEST.txt
          echo
          cat engine-build/out/tex-versions.txt

      - name: Every fixture renders
        # The suite prints LIMIT, never PASS, for a documented boundary, and LIFTED if one starts
        # working. A limitation that quietly becomes a pass is a fact about the engine nobody
        # would otherwise notice.
        run: npm run smoke

      - name: The fork still matches upstream
        # engine-src/library.ts is a fork of a WebAssembly host. It is only defensible if it can
        # show it changed nothing observable, everywhere it did not mean to.
        run: npm run verify:fork

      - name: The shipped worker renders identically
        run: npm run verify:worker

      - name: Build the plugin
        run: npm run build

      - name: Size
        run: |
          node -e '
            const { statSync } = require("fs");
            const mb = (p) => statSync(p).size / 1048576;
            const main = mb("main.js");
            const styles = mb("styles.css");
            console.log(`main.js ${main.toFixed(2)} MB, styles.css ${styles.toFixed(2)} MB`);
            // A ceiling, not a target. main.js is dominated by the base64 core dump; the honest
            // fix is a leaner dump, not shaving elsewhere, and this is here so that any OTHER
            // growth is visible rather than lost in the noise.
            if (main > 13) { console.error("main.js exceeded 13 MB"); process.exit(1); }
            if (styles > 0.4) { console.error("styles.css exceeded 400 KB"); process.exit(1); }
          '

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            main.js
            manifest.json
            styles.css
          retention-days: 14
