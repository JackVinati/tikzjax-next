name: Engine

# The TeX engine build: Pascal -> WebAssembly, a 156 MiB core dump, and 245 TeX files resolved
# out of a pinned TeX Live. It takes about ten minutes and needs Docker, so it does not run on
# every push. It runs when its own inputs change, on a weekly schedule so a rotted upstream is
# found before a release needs it, and on demand.
on:
  push:
    # Branches only. A tag push runs the release workflow, which builds and verifies the engine
    # itself — without this filter both run, and the same fifteen minutes are spent twice.
    branches:
      - '**'
    paths:
      - 'engine-build/**'
      - 'engine-src/**'
      - '.github/workflows/engine.yml'
  pull_request:
    paths:
      - 'engine-build/**'
      - 'engine-src/**'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the engine image
        run: npm run engine:image

      - name: Build the engine
        run: npm run engine:build

      - name: The committed engine is the one this source produces
        # The compressed engine is committed so that `npm run build` works in a clean checkout with
        # no Docker (internal/DECISIONS.md D12). That is only honest if it can be checked, which is
        # why the build is reproducible: the TeX clock is pinned and gzip is called with -n, so the
        # same image produces the same bytes.
        #
        # SAME IMAGE. The image installs Ubuntu's texlive with no version pin, so the day the
        # archive ships a texlive update this step fails — correctly, because the engine genuinely
        # changed, but through no commit of ours. tex-versions.txt is printed first for exactly
        # that reason: it says whether the TeX distribution moved or whether something subtler did.
        run: |
          if ! git diff --stat --exit-code -- engine-build/out; then
            echo "::error::the committed engine differs from a fresh build of this source"
            echo
            echo "Read BUILD-MANIFEST's 'format inputs' line in the diff above before anything else."
            echo "core.dump is built from latex.ltx and 145 other kernel files that are not bundled"
            echo "and appear nowhere else here, so that hash is the only thing that distinguishes"
            echo "'Ubuntu shipped a LaTeX update' from 'this build stopped being deterministic'."
            echo
            echo "What this build resolved:"
            cat engine-build/out/BUILD-MANIFEST.txt
            echo
            cat engine-build/out/tex-versions.txt
            echo
            echo "Rebuild and commit the result:  npm run engine:image && npm run engine:build"
            exit 1
          fi
          echo "engine-build/out matches a fresh build, byte for byte"

      - name: Report what it shipped
        run: |
          cat engine-build/out/BUILD-MANIFEST.txt
          echo
          cat engine-build/out/tex-versions.txt

      - name: Every fixture renders
        # The suite prints LIMIT, never PASS, for a documented boundary, and LIFTED if one starts
        # working. A limitation that quietly becomes a pass is a fact about the engine nobody
        # would otherwise notice.
        run: npm run smoke

      - name: The fork still matches upstream
        # engine-src/library.ts is a fork of a WebAssembly host. It is only defensible if it can
        # show it changed nothing observable, everywhere it did not mean to.
        run: npm run verify:fork

      - name: The shipped worker renders identically
        run: npm run verify:worker

      - name: Build the plugin
        run: npm run build

      - name: Size
        run: |
          node -e '
            const { statSync } = require("fs");
            const mb = (p) => statSync(p).size / 1048576;
            const main = mb("main.js");
            const styles = mb("styles.css");
            console.log(`main.js ${main.toFixed(2)} MB, styles.css ${styles.toFixed(2)} MB`);
            // A ceiling, not a target. main.js is dominated by the base64 core dump; the honest
            // fix is a leaner dump, not shaving elsewhere, and this is here so that any OTHER
            // growth is visible rather than lost in the noise.
            if (main > 13) { console.error("main.js exceeded 13 MB"); process.exit(1); }
            if (styles > 0.4) { console.error("styles.css exceeded 400 KB"); process.exit(1); }
          '

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            main.js
            manifest.json
            styles.css
          retention-days: 14
