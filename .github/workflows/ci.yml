name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # No Docker TeX build here — that is engine.yml's job and takes ten minutes. The plugin build
      # below is a different thing and now costs half a second, because the compressed engine is
      # committed (internal/DECISIONS.md D12). Until it was, CI never built the plugin at all and a
      # broken build was only discovered while cutting a release.
      - name: Lint
        run: npm run lint

      - name: Store guidelines
        run: npm run lint:store

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # The sha256 is printed, not just computed. A release asset has to match what anyone gets by
        # building the same commit — the community store checks exactly that — and this is where a
        # divergence between platforms or between the committed engine and the released one becomes
        # visible without cutting a release to find out.
        run: |
          npm run build
          echo "main.js    $(sha256sum main.js | cut -d' ' -f1)"
          echo "styles.css $(sha256sum styles.css | cut -d' ' -f1)"

      - name: No network in the plugin source
        # The plugin makes zero network requests, and that is an invariant rather than a policy:
        # the engine runs entirely offline and the only outbound call upstream ever made was a
        # broken-image marker fetched from a third-party domain on every failed render.
        run: |
          # Comment lines are excluded, or this fails on the comment in engine-src/library.ts
          # explaining that upstream's `fetch(filename)` fallback is the thing we removed.
          # engine-src/upstream/ is the pristine reference copy and is never bundled.
          hits=$(grep -rnE "\b(fetch|XMLHttpRequest|sendBeacon|WebSocket)\s*\(" src/ engine-src/ \
                   --include='*.ts' \
                 | grep -v '^engine-src/upstream/' \
                 | grep -vE ':[[:space:]]*(\*|//|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a network call reached the plugin source"
            exit 1
          fi

      - name: Manifest and versions.json agree
        # versions.json drifted five releases behind the manifest in the plugin this forks from,
        # because nothing ever compared them.
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            if (!versions[manifest.version]) {
              console.error(`versions.json has no entry for manifest version ${manifest.version}`);
              process.exit(1);
            }
            if (versions[manifest.version] !== manifest.minAppVersion) {
              console.error("versions.json disagrees with manifest.minAppVersion");
              process.exit(1);
            }
          '
