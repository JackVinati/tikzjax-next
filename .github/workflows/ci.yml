name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole file on the tagged commit before it builds anything. The
  # tag is pushed before main, so without that the commit a release is cut from would only meet
  # these checks after it had shipped.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit with the release in a comment: a tag can be moved to other code
      # after review, a commit cannot. All three run on Node 24; the v4s ran on the retired Node 20.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after the checkout talks to GitHub, so nothing keeps the token: not npm ci's
          # install scripts, not the dev tooling, not a test.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # No Docker TeX build here — that is engine.yml's job and takes ten minutes. The plugin build
      # below is a different thing: the compressed engine is committed (internal/DECISIONS.md D12),
      # so it takes a few seconds, most of them packing the core dump (D18). Until it was, CI never
      # built the plugin at all and a broken build was only discovered while cutting a release.
      - name: Lint
        run: npm run lint

      - name: Store guidelines
        run: npm run lint:store

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck under TypeScript 5
        # TypeScript 7 does the real typechecking, but the store's linter reads this code through
        # TypeScript 5, and the two do not always agree: a declaration TS 7 accepted came out of
        # TS 5 as an error type and silently untyped the worker's inventory. This used to be
        # `tsc --noEmit`, which never ran TS 5 at all — both packages ship a `tsc` bin and the
        # TypeScript 7 alias won — so it is called by path now.
        run: npm run typecheck:legacy

      - name: Test
        # With coverage, which fails the step if it falls below the floors in vitest.config.ts.
        run: npm run test:coverage

      - name: Coverage summary
        # Into the job summary, not to a coverage service: nothing here needs an account or a token,
        # and the numbers are read where the run is read. Runs when the tests failed too, since a
        # floor that was missed is exactly when the numbers are wanted.
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const file = "coverage/coverage-summary.json";
            if (!fs.existsSync(file)) process.exit(0);
            const summary = JSON.parse(fs.readFileSync(file, "utf8"));
            const pct = (m) => (typeof m.pct === "number" ? `${m.pct.toFixed(1)}%` : String(m.pct));
            const kinds = ["statements", "branches", "functions", "lines"];
            const out = ["### Test coverage", "", "| | Covered | Total | |", "| --- | --: | --: | --: |"];
            for (const k of kinds) {
              const m = summary.total[k];
              out.push(`| ${k} | ${m.covered} | ${m.total} | ${pct(m)} |`);
            }
            const files = Object.entries(summary)
              .filter(([name]) => name !== "total")
              .sort(([, a], [, b]) => a.statements.pct - b.statements.pct);
            out.push("", "<details><summary>By file, least covered first</summary>", "");
            out.push("| File | Statements | Branches | Functions | Lines |", "| --- | --: | --: | --: | --: |");
            for (const [name, m] of files) {
              out.push(`| ${path.relative(process.cwd(), name)} | ${kinds.map((k) => pct(m[k])).join(" | ")} |`);
            }
            out.push("", "</details>", "");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n"));
          '

      # The engine checks. They need no Docker, because the engine is committed (D12): the real TeX
      # runs in Node, in about half a minute for all three. They used to run only in the Engine
      # workflow (weekly, or when engine-build/ or engine-src/ changed) and in the release, so a
      # pull request bumping a package the worker bundles — dvi2html, pako, buffer — was not
      # rendered through until a Monday or a release.
      - name: Every fixture renders
        # LIMIT, never PASS, for a documented boundary; LIFTED if one starts working.
        run: npm run smoke

      - name: Every fixture renders what the golden corpus recorded
        # The DVI, the transcript and the SVG, byte for byte (internal/DECISIONS.md D13).
        run: npm run verify:golden

      - name: The shipped worker renders identically
        run: npm run verify:worker

      - name: Build
        # The sha256 is printed, not just computed. A release asset has to match what anyone gets by
        # building the same commit — the community store checks exactly that — and this is where a
        # divergence between platforms or between the committed engine and the released one becomes
        # visible without cutting a release to find out.
        run: |
          npm run build
          echo "main.js    $(sha256sum main.js | cut -d' ' -f1)"
          echo "styles.css $(sha256sum styles.css | cut -d' ' -f1)"

      - name: No network in the plugin source
        # The plugin makes zero network requests, and that is an invariant rather than a policy:
        # the engine runs entirely offline and the only outbound call upstream ever made was a
        # broken-image marker fetched from a third-party domain on every failed render.
        run: |
          # Comment lines are excluded, or this fails on the comment in engine-src/library.ts
          # explaining that upstream's `fetch(filename)` fallback is the thing we removed.
          # engine-src/upstream/ is the pristine reference copy and is never bundled.
          hits=$(grep -rnE "\b(fetch|XMLHttpRequest|sendBeacon|WebSocket)\s*\(" src/ engine-src/ \
                   --include='*.ts' \
                 | grep -v '^engine-src/upstream/' \
                 | grep -vE ':[[:space:]]*(\*|//|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a network call reached the plugin source"
            exit 1
          fi

      - name: Manifest and versions.json agree
        # versions.json drifted five releases behind the manifest in the plugin this forks from,
        # because nothing ever compared them.
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            if (!versions[manifest.version]) {
              console.error(`versions.json has no entry for manifest version ${manifest.version}`);
              process.exit(1);
            }
            if (versions[manifest.version] !== manifest.minAppVersion) {
              console.error("versions.json disagrees with manifest.minAppVersion");
              process.exit(1);
            }
          '

  native-unicode:
    # The pre-flight lint's list of characters the engine typesets by itself is measured from the
    # committed engine, and this measures it again: about 1,500 TeX runs, a minute or so. It is a job
    # of its own so that it runs beside `check` rather than after it — a push waits for the longer of
    # the two, not for their sum.
    #
    # It runs on every push rather than behind a path filter. The list goes stale when the engine
    # changes, when anything under engine-src/ changes (that moves the ENGINE_ID the file records),
    # when dvi2html changes or when the scan does; a filter naming all of those is one more list to
    # keep in step, and the one it forgot would be the one that shipped a stale list.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: src/source/native-unicode.ts describes the committed engine
        run: npm run scan:native -- --check
