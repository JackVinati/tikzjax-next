<svg xmlns="http://www.w3.org/2000/svg" width="640" height="518" viewBox="0 0 640 518" role="img" aria-labelledby="title desc">
<title id="title">Engine start and memory, 0.1.5 and 0.2.0, Windows desktop, Node 22.19 (V8)</title>
<desc id="desc">Four pairs of horizontal bars, a grey bar for 0.1.5 and a blue bar for 0.2.0, each pair on its own scale: engine start, 528 ms and 161 ms; a small diagram, compiled in the running engine worker, 61 ms and 27 ms; memory buffers held once started, 157.5 MiB and 23.5 MiB; peak memory of the whole test process, five compiles, 703 MiB and 168 MiB. Every blue bar is shorter than the grey bar above it, between 15 and 44 percent of its length.</desc>
<style>
	.card { fill: #f6f8fa; stroke: #d1d9e0; }
	text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
	.t1 { fill: #1f2328; }
	.t2 { fill: #59636e; }
	.num { font-variant-numeric: tabular-nums; }
	.rule { stroke: #d1d9e0; stroke-width: 1; }
	.base { stroke: #808893; stroke-width: 1; }
	.link { stroke: #808893; stroke-width: 2; fill: none; }
	.open { stroke: #808893; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
	.old { fill: #656d76; }
	.new { fill: #2a78d6; }
	.dot { fill: #2a78d6; stroke: #f6f8fa; stroke-width: 2; }
	.ring { fill: none; stroke: #2a78d6; stroke-width: 2; }
	.todo { fill: #f6f8fa; stroke: #656d76; stroke-width: 2; }
	@media (prefers-color-scheme: dark) {
		.card { fill: #161b22; stroke: #3d444d; }
		.t1 { fill: #f0f6fc; }
		.t2 { fill: #9198a1; }
		.rule { stroke: #3d444d; }
		.base { stroke: #626c78; }
		.link { stroke: #626c78; }
		.open { stroke: #626c78; }
		.old { fill: #6e7681; }
		.new { fill: #3987e5; }
		.dot { fill: #3987e5; stroke: #161b22; }
		.ring { stroke: #3987e5; }
		.todo { fill: #161b22; stroke: #6e7681; }
	}
</style>
