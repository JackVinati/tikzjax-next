<svg xmlns="http://www.w3.org/2000/svg" width="640" height="544" viewBox="0 0 640 544" role="img" aria-labelledby="title desc">
<title id="title">What a new diagram waits for, 0.2.0 and 0.2.1, Windows desktop, Chromium 153 (V8)</title>
<desc id="desc">Four pairs of horizontal bars, a grey bar for 0.2.0 and a blue bar for 0.2.1, each pair on its own scale: wait before a new diagram goes to the engine, 300 ms and 0 ms; engine start, 162 ms and 54 ms; first small diagram after the start, 38 ms and 46 ms; the same diagram, the engine running, 24 ms and 7 ms.</desc>
<style>
	.card { fill: #f6f8fa; stroke: #d1d9e0; }
	text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
	.t1 { fill: #1f2328; }
	.t2 { fill: #59636e; }
	.num { font-variant-numeric: tabular-nums; }
	.rule { stroke: #d1d9e0; stroke-width: 1; }
	.base { stroke: #808893; stroke-width: 1; }
	.link { stroke: #808893; stroke-width: 2; fill: none; }
	.open { stroke: #808893; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
	.old { fill: #656d76; }
	.new { fill: #2a78d6; }
	.dot { fill: #2a78d6; stroke: #f6f8fa; stroke-width: 2; }
	.ring { fill: none; stroke: #2a78d6; stroke-width: 2; }
	.todo { fill: #f6f8fa; stroke: #656d76; stroke-width: 2; }
	.snap { fill: #13895f; }
	@media (prefers-color-scheme: dark) {
		.card { fill: #161b22; stroke: #3d444d; }
		.t1 { fill: #f0f6fc; }
		.t2 { fill: #9198a1; }
		.rule { stroke: #3d444d; }
		.base { stroke: #626c78; }
		.link { stroke: #626c78; }
		.open { stroke: #626c78; }
		.old { fill: #6e7681; }
		.new { fill: #3987e5; }
		.dot { fill: #3987e5; stroke: #161b22; }
		.ring { stroke: #3987e5; }
		.todo { fill: #161b22; stroke: #6e7681; }
		.snap { fill: #199e70; }
	}
</style>
<rect x="0.5" y="0.5" width="639" height="543" rx="10" class="card"/>
<text x="24" y="42" class="t1" font-size="22" font-weight="600">What a new diagram waits for</text>
<text x="24" y="70" class="t2" font-size="17">Each pair drawn to its own scale. Shorter is better.</text>
