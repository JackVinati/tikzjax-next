<text x="24" y="470" class="t2" font-size="18">Windows desktop, Chromium 153 (V8). Medians of 7 fresh browsers.</text>
<text x="24" y="496" class="t2" font-size="18">A diagram’s time runs from handing it to the engine to its SVG back.</text>
<text x="24" y="522" class="t2" font-size="18">The wait is the plugin’s setting, not a measurement.</text>
