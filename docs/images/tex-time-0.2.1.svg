<svg xmlns="http://www.w3.org/2000/svg" width="640" height="840" viewBox="0 0 640 840" role="img" aria-labelledby="title desc">
<title id="title">TeX time per diagram, 0.2.0 and 0.2.1, Windows desktop, headless Chromium 153, not in Obsidian</title>
<desc id="desc">Three horizontal bars for each of 8 of the 37 test diagrams, slowest first: grey for 0.2.0, blue for 0.2.1 compiling the diagram from the start, and green for 0.2.1 starting from a saved preamble, each labelled in milliseconds. The blue bar is shorter than the grey one in every row, and the green bar in every row, much shorter where the diagram loads packages. Over all 37 diagrams TeX's time falls by 35 percent from the start, 29 to 63 percent per diagram, and by 73 percent from a saved preamble.</desc>
